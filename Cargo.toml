[workspace]
members = [
    "crates/micontrol-core",
    "crates/micontrol-windows",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "2.0.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Lucasmantou/MiControl"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
