[package]
name = "micontrol-windows-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "micontrol_windows_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
runtime-simulation = []

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
micontrol-core = { path = "../crates/micontrol-core" }
micontrol-windows = { path = "../crates/micontrol-windows" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.5"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
